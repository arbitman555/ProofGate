# ProofGate: audit issues labeled `security-report`.
#
# Triggers when the `security-report` label is added to an issue. The issue
# body is treated as an untrusted vulnerability report: it is audited against
# this repo at its default branch, and the verdict is posted as an issue
# comment. All verdicts are advisory; a human makes the final call.
#
# Setup: see docs/github-action.md.

name: proofgate

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

jobs:
  audit:
    if: github.event.label.name == 'security-report'
    runs-on: ubuntu-latest
    env:
      MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ProofGate
        run: pip install .

      - name: Require MODEL_API_KEY
        run: |
          if [ -z "$MODEL_API_KEY" ]; then
            echo "::error::MODEL_API_KEY secret is not set. See docs/github-action.md."
            exit 1
          fi

      - name: Save the issue body as the report
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python -c "import os,pathlib; pathlib.Path('/tmp/report.md').write_text(os.environ.get('ISSUE_BODY') or '(empty issue body)', encoding='utf-8')"

      - name: Audit the report and write the comment
        env:
          REPO_BRANCH: ${{ github.event.repository.default_branch }}
          BLOB_BASE: https://github.com/${{ github.repository }}/blob/${{ github.event.repository.default_branch }}
        run: |
          python -c "import os; from proofgate.notify import audit_issue_report; audit_issue_report(report_path='/tmp/report.md', repo_source=os.environ['GITHUB_WORKSPACE'], version=os.environ['REPO_BRANCH'], blob_base=os.environ['BLOB_BASE'], comment_path='/tmp/proofgate-comment.md', allowlist_extra=os.environ['GITHUB_WORKSPACE'])"

      - name: Post the verdict as an issue comment
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body-file /tmp/proofgate-comment.md
