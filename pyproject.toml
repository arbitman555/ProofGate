[project]
name = "proofgate"
version = "0.1.0"
description = "AI gatekeeper for security reports (hackathon skeleton)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "openai>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
proofgate = "proofgate.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: calls the real model; skipped unless MODEL_API_KEY is set",
]
